[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # paste is a build-time macro pulled in by exr -> pulp. It is archived,
    # not vulnerable, and no maintained release of exr avoids it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time macro via exr -> pulp" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla's CA root list (webpki-roots), used for TLS to S3 and PostgreSQL.
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

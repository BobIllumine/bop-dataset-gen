# bop-server, optionally with its own PostgreSQL and MinIO, the studio, and authentik.
#
#   Everything in containers:      docker compose -f deploy/compose.yaml --profile local up -d
#   External PostgreSQL / MinIO:   set the variables in deploy/.env (see .env.example), then
#                                  docker compose -f deploy/compose.yaml up -d
#   With the studio:               add --profile studio (built from ../bop-studio)
#   With authentik in containers:  add -f deploy/authentik.yaml (see that file)
#   With an external authentik:    set BOP_OIDC_* in deploy/.env
#
# The server needs credentials (BOP_API_TOKEN and/or BOP_OIDC_*) unless
# BOP_ALLOW_ANONYMOUS=true. Published ports listen on 127.0.0.1 only; put a
# TLS reverse proxy in front, or set the *_BIND variables, to serve others.
#
# Without compose, `bop-server` alone defaults to SQLite and a local directory.

services:
  bop-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Set to a published image (e.g. ghcr.io/bobillumine/bop-server:0.1.1) to pull instead of build.
    image: ${BOP_SERVER_IMAGE:-bop-server:latest}
    restart: unless-stopped
    ports:
      - "${BOP_BIND:-127.0.0.1}:${BOP_PORT:-8080}:8080"
    environment:
      BOP_DATABASE_URL: ${BOP_DATABASE_URL:-postgres://bop:bop@postgres:5432/bop}
      BOP_STORAGE_URL: ${BOP_STORAGE_URL:-s3://bop}
      BOP_API_TOKEN: ${BOP_API_TOKEN:-}
      BOP_OIDC_ISSUER: ${BOP_OIDC_ISSUER:-}
      BOP_OIDC_CLIENT_ID: ${BOP_OIDC_CLIENT_ID:-}
      BOP_OIDC_JWKS_URL: ${BOP_OIDC_JWKS_URL:-}
      BOP_OIDC_GROUPS: ${BOP_OIDC_GROUPS:-}
      BOP_ALLOW_ANONYMOUS: ${BOP_ALLOW_ANONYMOUS:-false}
      BOP_CORS_ORIGINS: ${BOP_CORS_ORIGINS:-}
      BOP_MAX_SCENES: ${BOP_MAX_SCENES:-100000}
      BOP_LOG: ${BOP_LOG:-info}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
      AWS_ALLOW_HTTP: ${AWS_ALLOW_HTTP:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-bop}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-bop-minio-secret}
    volumes:
      - bop-data:/var/lib/bop
    # Lets in-flight scenes commit before the container is killed.
    stop_grace_period: 5m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, graphics, utility]

  bop-studio:
    profiles: [studio]
    build:
      context: ${BOP_STUDIO_CONTEXT:-../../bop-studio}
    image: ${BOP_STUDIO_IMAGE:-bop-studio:latest}
    restart: unless-stopped
    ports:
      - "${BOP_STUDIO_BIND:-127.0.0.1}:${BOP_STUDIO_PORT:-3000}:8080"
    environment:
      BOP_API_UPSTREAM: bop-server:8080
      BOP_CONNECT_SRC: ${BOP_CONNECT_SRC:-https:}
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - bop-server

  postgres:
    profiles: [local]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bop
      POSTGRES_PASSWORD: bop
      POSTGRES_DB: bop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bop -d bop"]
      interval: 5s
      retries: 20

  minio:
    profiles: [local]
    # MinIO stopped publishing official images in 2025; this is the community fork.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: bop
      MINIO_ROOT_PASSWORD: bop-minio-secret
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    profiles: [local]
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      - minio
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 bop bop-minio-secret; do sleep 2; done
      && mc mb --ignore-existing local/bop"

volumes:
  bop-data:
  postgres-data:
  minio-data:

[package]
name = "bpp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bpp"
path = "src/main.rs"

[features]
default = ["fast", "wgpu"]
fast = ["bpp-pipeline/fast"]
reproducible = ["bpp-pipeline/reproducible"]
wgpu = []
blenderproc = []

[lints]
workspace = true

[dependencies]
bpp-pipeline = { path = "../bpp-pipeline", default-features = false }

[package]
name = "bpp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bpp"
path = "src/main.rs"

[features]
default = ["fast", "wgpu"]
fast = ["bpp-pipeline/fast"]
reproducible = ["bpp-pipeline/reproducible"]
wgpu = ["dep:bpp-render-wgpu"]
blenderproc = ["dep:bpp-render-blenderproc"]

[lints]
workspace = true

[dependencies]
bpp-pipeline = { path = "../bpp-pipeline", default-features = false }
bpp-assets = { path = "../bpp-assets" }
bpp-dataset = { path = "../bpp-dataset" }
bpp-core = { path = "../bpp-core", features = ["schema"] }
bpp-render-api = { path = "../bpp-render-api" }
bpp-render-wgpu = { path = "../bpp-render-wgpu", optional = true }
bpp-render-blenderproc = { path = "../bpp-render-blenderproc", optional = true }
serde_json = { version = "1" }
toml = "1.1.4"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["env-filter", "fmt", "json", "std"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "bpp-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "bpp"
path = "src/main.rs"

[features]
default = ["fast", "wgpu"]
fast = ["bpp-pipeline/fast"]
reproducible = ["bpp-pipeline/reproducible"]
wgpu = ["dep:bpp-core", "dep:bpp-render-wgpu", "dep:serde_json"]
blenderproc = ["dep:bpp-core", "dep:bpp-render-blenderproc", "dep:serde_json"]

[lints]
workspace = true

[dependencies]
bpp-pipeline = { path = "../bpp-pipeline", default-features = false }
bpp-core = { path = "../bpp-core", optional = true }
bpp-render-wgpu = { path = "../bpp-render-wgpu", optional = true }
bpp-render-blenderproc = { path = "../bpp-render-blenderproc", optional = true }
serde_json = { version = "1", optional = true }

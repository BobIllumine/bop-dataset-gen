[package]
name = "bpp-physics-rapier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = ["fast"]
fast = ["rapier3d/simd8"]
reproducible = ["rapier3d/enhanced-determinism"]

[dependencies]
blake3 = "=1.8.7"
bpp-assets = { path = "../bpp-assets" }
bpp-core = { path = "../bpp-core" }
rapier3d = { version = "=0.35.2", default-features = false, features = ["dim3", "f32", "std"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

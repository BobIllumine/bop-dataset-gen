[package]
name = "bpp-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["fast"]
fast = ["bpp-physics-rapier/fast"]
reproducible = ["bpp-physics-rapier/reproducible"]

[dependencies]
bpp-assets = { path = "../bpp-assets" }
bpp-core = { path = "../bpp-core" }
bpp-render-api = { path = "../bpp-render-api" }
bpp-dataset = { path = "../bpp-dataset" }
bpp-physics-rapier = { path = "../bpp-physics-rapier", default-features = false }
blake3 = "=1.8.7"
crossbeam-channel = "=0.5.16"
rayon = "=1.11.0"
glam = "0.30"
serde_json = "1"
serde = "1"
thiserror = "2"
tracing = "=0.1.41"

[dev-dependencies]
tempfile = "3"

[package]
name = "bop-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "=1.8.7"
bop-core = { path = "../bop-core" }
glam = "0.30"
gltf = { version = "=1.4.1", default-features = false, features = ["utils"] }
image = { version = "=0.25.10", default-features = false, features = ["hdr", "jpeg", "png"] }
exr = "=1.74.0"
meshopt = "=0.6.2"
serde_json = "1"
parry3d = { version = "=0.30.2", default-features = false, features = ["alloc", "dim3", "f32", "std"] }
stl_io = "=0.11.0"
thiserror = "2"

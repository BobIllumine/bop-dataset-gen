[package]
name = "bop-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["fast"]
fast = ["bop-physics-rapier/fast"]
reproducible = ["bop-physics-rapier/reproducible"]

[dependencies]
bop-assets = { path = "../bop-assets" }
bop-core = { path = "../bop-core" }
bop-render-api = { path = "../bop-render-api" }
bop-dataset = { path = "../bop-dataset" }
bop-physics-rapier = { path = "../bop-physics-rapier", default-features = false }
blake3 = "=1.8.7"
crossbeam-channel = "=0.5.16"
rayon = "=1.11.0"
glam = "0.30"
serde_json = "1"
serde = "1"
thiserror = "2"
tracing = "=0.1.41"

[dev-dependencies]
png = "=0.18.1"
tempfile = "3"

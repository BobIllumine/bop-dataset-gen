[package]
name = "bpp-render-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bpp-assets = { path = "../bpp-assets" }
bpp-core = { path = "../bpp-core" }
bpp-dataset = { path = "../bpp-dataset" }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
pollster = "=0.4.0"
thiserror = "2"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "vulkan"] }

[dev-dependencies]
blake3 = "=1.8.7"
serde_json = "1"

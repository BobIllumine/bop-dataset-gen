[package]
name = "bop-render-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bop-assets = { path = "../bop-assets" }
bop-core = { path = "../bop-core" }
bop-render-api = { path = "../bop-render-api" }
bop-dataset = { path = "../bop-dataset" }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
half = "=2.7.1"
pollster = "=1.0.1"
thiserror = "2"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["dx12", "vulkan"] }

[dev-dependencies]
blake3 = "=1.8.7"
serde_json = "1"
tempfile = "3"

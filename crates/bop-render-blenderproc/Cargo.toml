[package]
name = "bop-render-blenderproc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bop-assets = { path = "../bop-assets" }
bop-core = { path = "../bop-core" }
bop-render-api = { path = "../bop-render-api" }
bop-dataset = { path = "../bop-dataset" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

[dev-dependencies]
blake3 = "=1.8.7"
bop-render-wgpu = { path = "../bop-render-wgpu" }
exr = "=1.74.0"
png = "=0.18.1"
tempfile = "3"

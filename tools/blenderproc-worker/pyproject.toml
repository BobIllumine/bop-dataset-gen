[project]
name = "bop-blenderproc-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "blenderproc==2.8.0",
    "numpy>=1.24,<3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# BlenderProc requires `import blenderproc` before every other import.
"blenderproc_worker.py" = ["E402"]

[workspace]
resolver = "3"
members = [
    "crates/bop-assets",
    "crates/bop-cli",
    "crates/bop-core",
    "crates/bop-dataset",
    "crates/bop-physics-rapier",
    "crates/bop-pipeline",
    "crates/bop-render-api",
    "crates/bop-render-blenderproc",
    "crates/bop-render-wgpu",
    "crates/bop-run",
    "crates/bop-server",
    "xtask",
]
default-members = ["crates/bop-cli"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

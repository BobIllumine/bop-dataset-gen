name: Feature or task
description: New behaviour, an improvement, documentation, or cleanup.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong today, and who it affects.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: A check anyone can repeat. A command and its expected output, a passing test, or a number to reach.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope
      description: What this will not do.
  - type: dropdown
    id: design
    attributes:
      label: Needs a design note?
      description: Required for changes to formats, determinism, the API, crate boundaries, or security. See the contributor guide, "How we work".
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

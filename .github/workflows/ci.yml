name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the channel and components.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        name: [fast, reproducible]
        include:
          - name: fast
            args: --workspace --all-targets --features bop-cli/blenderproc
          - name: reproducible
            args: -p bop-cli -p bop-pipeline -p bop-physics-rapier --all-targets --no-default-features --features bop-cli/reproducible,bop-cli/wgpu,bop-cli/blenderproc,bop-pipeline/reproducible,bop-physics-rapier/reproducible
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - run: cargo clippy --locked ${{ matrix.args }} -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        name: [fast, reproducible]
        include:
          - name: fast
            args: --workspace
          - name: reproducible
            args: -p bop-cli -p bop-pipeline -p bop-physics-rapier --no-default-features --features bop-cli/reproducible,bop-cli/wgpu,bop-cli/blenderproc,bop-pipeline/reproducible,bop-physics-rapier/reproducible
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.name }}
      # Hardware tests are #[ignore]d here and run in the Hardware workflow.
      # --no-fail-fast reports every failing test binary, not just the first.
      - run: cargo test --locked --no-fail-fast ${{ matrix.args }}

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --locked

  schema:
    name: Config schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p xtask -- schema --check

  book:
    name: Developer guide
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build docs

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - run: |
          {
            echo '### Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  worker:
    name: BlenderProc worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/blenderproc-worker
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - run: uvx ruff@0.12.0 check .
      - run: uv run --no-project --python 3.11 python -m py_compile blenderproc_worker.py

  server:
    name: Job server (PostgreSQL, MinIO, lavapipe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bop
          POSTGRES_PASSWORD: bop
          POSTGRES_DB: bop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bop -d bop"
          --health-interval 5s --health-retries 20
    env:
      BOP_TEST_DATABASE_URL: postgres://bop:bop@127.0.0.1:5432/bop
      BOP_TEST_STORAGE_URL: s3://bop/ci
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ALLOW_HTTP: "true"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: bop
      AWS_SECRET_ACCESS_KEY: bop-minio-secret
    steps:
      - uses: actions/checkout@v7
      # Service containers cannot take a command, and MinIO needs `server`.
      - name: Start MinIO and create the bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for _ in $(seq 60); do curl -fs http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          aws --endpoint-url "$AWS_ENDPOINT_URL" s3 mb s3://bop
      - name: Install the lavapipe software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: server
      - name: Require a wgpu adapter
        run: cargo run --locked -p bop-cli -- doctor --renderer wgpu
      - run: cargo test --locked -p bop-server --test end_to_end -- --ignored

  ci-ok:
    name: CI passed
    if: always()
    needs: [fmt, clippy, test, docs, schema, book, deny, coverage, worker, server]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'

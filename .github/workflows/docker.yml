name: Docker image

# Builds deploy/Dockerfile and pushes it to GitHub Packages
# (ghcr.io/<owner>/bop-server) and, when configured, Docker Hub. After CI
# passes on a push to master, the image is pushed as `latest` and
# `sha-<commit>`; version tags (v*) are pushed as the version once CI for that
# tag passes. Pull requests that touch the image build it without pushing.
#
# To publish an existing release tag again (for example to a newly added
# registry), run this workflow by hand with `tag` set:
#   gh workflow run docker.yml -f tag=v0.1.1
#
# GitHub Packages needs no settings. For Docker Hub, set:
#   variable DOCKERHUB_USERNAME   Docker Hub account (or organization)
#   variable DOCKERHUB_IMAGE      optional; defaults to <DOCKERHUB_USERNAME>/bop-server
#   secret   DOCKERHUB_TOKEN      access token with Read & Write scope

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - deploy/**
      - .dockerignore
      - Cargo.lock
      - rust-toolchain.toml
      - tools/blenderproc-worker/**
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and push, such as v0.1.1. Empty builds the selected branch as latest.
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.tag || github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Tag pushes do not run CI, so run it here before publishing a release image.
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
    needs: [test]
    # Runs when `test` was skipped (not a tag push) but never after it failed.
    if: >-
      !cancelled() && needs.test.result != 'failure' && (
        github.event_name != 'workflow_run' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || (vars.DOCKERHUB_USERNAME && format('{0}/bop-server', vars.DOCKERHUB_USERNAME)) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A workflow_run event otherwise checks out the default branch.
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
      - name: Check the Docker Hub settings
        if: env.PUSH == 'true' && env.DOCKERHUB_IMAGE != ''
        env:
          TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != true ]; then
            echo "::error::DOCKERHUB_USERNAME is set but the DOCKERHUB_TOKEN secret is not"
            exit 1
          fi
      # The Rust build and Blender together need more than the runner's free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        if: env.PUSH == 'true' && env.DOCKERHUB_IMAGE != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Registry names must be lowercase; metadata-action's sha tag would use
      # the default branch head on workflow_run.
      - id: names
        run: |
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo 'images<<EOF'
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bop-server"
            if [ -n "$DOCKERHUB_IMAGE" ]; then echo "$DOCKERHUB_IMAGE"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.tag == '') }}
            type=raw,value=sha-${{ steps.names.outputs.short }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
